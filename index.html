<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bản Đồ TP. Hồ Chí Minh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100vh; background: #c8d8e8; }
    .leaflet-control-attribution { display: none; }
    .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 2px 8px rgba(0,0,0,.25) !important;
      border-radius: 10px !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      width: 44px !important;
      height: 44px !important;
      line-height: 44px !important;
      font-size: 22px !important;
      color: #333 !important;
      background: #fff !important;
      border: none !important;
      display: block !important;
    }
    .leaflet-control-zoom a:hover { background: #f0f0f0 !important; }
    .leaflet-control-zoom-in  { border-bottom: 1px solid #e0e0e0 !important; }

    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      box-shadow: 0 6px 24px rgba(0,0,0,.18) !important;
      padding: 0 !important;
      overflow: hidden;
      border: none !important;
    }
    .leaflet-popup-content { margin: 0 !important; width: 290px !important; }
    .leaflet-popup-tip { background: #fff !important; }

    .popup-header {
      padding: 14px 16px 12px;
      color: #fff;
    }
    .popup-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      background: rgba(255,255,255,.22);
      border-radius: 20px;
      padding: 2px 9px;
      margin-bottom: 7px;
    }
    .popup-header h3 {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      font-family: 'Segoe UI', sans-serif;
    }
    .popup-body {
      background: #fff;
      padding: 12px 16px 14px;
    }
    .popup-row {
      display: flex;
      gap: 9px;
      margin-bottom: 7px;
      font-size: 13px;
      color: #444;
      line-height: 1.45;
      font-family: 'Segoe UI', sans-serif;
      align-items: flex-start;
    }
    .popup-row:last-child { margin-bottom: 0; }
    .popup-row .ic { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
const map = L.map('map', {
  center: [10.762, 106.682],
  zoom: 13,
  zoomControl: true,
  attributionControl: false,
  maxBounds: [[10.35, 106.35], [11.15, 107.05]],
  maxBoundsViscosity: 1.0,
  minZoom: 10
});

map.zoomControl.setPosition('bottomright');

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

// ── DỮ LIỆU TRƯỜNG ──────────────────────────────────────────────
const schools = [
  {

    color: "#B71C1C",
    rows: [
      ["📍", "53 Nguyễn Du, P. Bến Nghé, Quận 1"],
      ["🏛️", "Trường THCS–THPT công lập chất lượng cao"],
      ["📅", "Thành lập 1874 (tên gốc: Lasan Taberd), đổi tên nhiều lần; tách thành 2 trường năm 2024"],
      ["📚", "Tuyển sinh lớp 6 và lớp 10; định hướng hội nhập quốc tế"],
      ["🌐", "tdnschool.edu.vn"],
    ]
  },
  {
    name: "THPT Chuyên Trần Đại Nghĩa (CS mới – Thủ Đức)",
    lat: 10.7860, lng: 106.7400,
    color: "#B71C1C",
    rows: [
      ["📍", "Lô P2, Khu tái định cư 38,4 ha, P. An Khánh, TP. Thủ Đức"],
      ["🏛️", "Trường THPT Chuyên công lập, tách từ cơ sở cũ năm 2024"],
      ["📅", "Chính thức thành lập ngày 16/5/2024 theo QĐ UBND TP.HCM"],
      ["📚", "Tuyển sinh lớp 10 chuyên: Toán, Lý, Hóa, Sinh, Tin, Văn, Anh"],
      ["🌐", "trandainghia.edu.vn"],
    ]
  },
  {
    name: "THPT Lê Quý Đôn",
    lat: 10.7796, lng: 106.6918,
    color: "#1565C0",
    rows: [
      ["📍", "110 Nguyễn Thị Minh Khai, Quận 3"],
      ["🏛️", "Trường THPT công lập, Di tích Kiến trúc Nghệ thuật cấp TP"],
      ["📅", "Khởi công 1874, hoàn thành 1877 (tên gốc: Collège Chasseloup-Laubat); mang tên Lê Quý Đôn từ 1977"],
      ["📚", "Trường THPT cổ nhất TP.HCM, chương trình tiên tiến hội nhập quốc tế"],
      ["🌐", "thpt-lequydon-hcm.edu.vn"],
    ]
  },
  {
    name: "THPT Chuyên Lê Hồng Phong",
    lat: 10.7547, lng: 106.6686,
    color: "#1B5E20",
    rows: [
      ["📍", "235 Nguyễn Văn Cừ, P. 4, Quận 5"],
      ["🏛️", "Trường THPT Chuyên công lập hàng đầu cả nước"],
      ["📅", "Thành lập năm 1927 (tên gốc: Pétrus Trương Vĩnh Ký); mang tên Lê Hồng Phong từ 1975"],
      ["📚", "Cái nôi của nhiều nhà khoa học, chính trị gia; HCV Olympic quốc tế nhiều năm liên tiếp"],
      ["🌐", "thpt-lehongphong-tphcm.edu.vn"],
    ]
  },
  {
    name: "THPT Trưng Vương",
    lat: 10.7876, lng: 106.7068,
    color: "#4A148C",
    rows: [
      ["📍", "3 Nguyễn Bỉnh Khiêm, P. Đa Kao, Quận 1"],
      ["🏛️", "Trường THPT công lập, kiến trúc Pháp cổ kính — đề xuất di tích LS-VH năm 2021"],
      ["📅", "Truyền thống 100+ năm; dời về số 3 Nguyễn Bỉnh Khiêm từ năm 1957"],
      ["📚", "Từng là trường nữ sinh danh tiếng Sài Gòn; nay dạy cả nam lẫn nữ, điểm chuẩn top TP.HCM"],
      ["🌐", "thpttrungvuong.hcm.edu.vn"],
    ]
  }
];

// ── TẠO MARKER ──────────────────────────────────────────────────
schools.forEach(s => {
  const icon = L.divIcon({
    html: `
      <div style="
        position:relative;width:36px;height:44px;
      ">
        <div style="
          width:36px;height:36px;
          background:${s.color};
          border-radius:50% 50% 50% 0;
          transform:rotate(-45deg);
          border:2.5px solid #fff;
          box-shadow:0 3px 10px rgba(0,0,0,.35);
          display:flex;align-items:center;justify-content:center;
        ">
          <span style="transform:rotate(45deg);font-size:16px;line-height:1;">🏫</span>
        </div>
      </div>`,
    iconSize: [36, 44],
    iconAnchor: [18, 44],
    popupAnchor: [0, -46],
    className: ''
  });

  const rows = s.rows.map(r =>
    `<div class="popup-row"><span class="ic">${r[0]}</span><span>${r[1]}</span></div>`
  ).join('');

  const popup = `
    <div>
      <div class="popup-header" style="background:${s.color}">
        <div class="popup-tag">Trường học</div>
        <h3>${s.name}</h3>
      </div>
      <div class="popup-body">${rows}</div>
    </div>`;

  L.marker([s.lat, s.lng], { icon })
    .addTo(map)
    .bindPopup(popup, { maxWidth: 310, minWidth: 290 });
});

// ── MẶT NẠ TỈNH KHÁC ────────────────────────────────────────────
async function loadMask() {
  const query = `[out:json];relation(1903330);out geom;`;
  const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    const rel = data.elements[0];
    if (!rel) return;

    const outers = rel.members.filter(m => m.type === 'way' && m.role === 'outer');

    function dist(a, b) {
      return Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2);
    }
    function chain(ways) {
      const segs = ways.map(w => w.geometry.map(p => [p.lat, p.lon]));
      const out = [...segs[0]];
      const used = new Set([0]);
      while (used.size < segs.length) {
        const last = out[out.length - 1];
        let ok = false;
        for (let i = 0; i < segs.length; i++) {
          if (used.has(i)) continue;
          const s = segs[i];
          if (dist(last, s[0]) < 0.0001)        { out.push(...s.slice(1));            used.add(i); ok = true; break; }
          if (dist(last, s[s.length-1]) < 0.0001){ out.push(...[...s].reverse().slice(1)); used.add(i); ok = true; break; }
        }
        if (!ok) break;
      }
      return out;
    }

    const ring = chain(outers);
    const world = [[-90,-180],[-90,180],[90,180],[90,-180],[-90,-180]];
    L.geoJSON({
      type: 'Feature',
      geometry: {
        type: 'Polygon',
        coordinates: [world.map(p=>[p[1],p[0]]), ring.map(p=>[p[1],p[0]])]
      }
    }, {
      style: { fillColor:'#c8d8e8', fillOpacity:1, color:'#6a9fc0', weight:2 },
      interactive: false
    }).addTo(map);
  } catch(e) { console.warn(e); }
}

loadMask();
</script>
</body>
</html>
